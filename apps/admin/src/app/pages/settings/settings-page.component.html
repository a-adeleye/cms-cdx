<section>
  <article class="panel">
    <h2>Shortcut links</h2>
    <div class="stack">
      @for (group of settingsGroups; track group.title) {
        <article class="settings-group">
          <h3>{{ group.title }}</h3>
          <div class="settings-link-grid">
            @for (link of group.links; track link.path) {
              <a class="list-card settings-link" [routerLink]="link.path">
                <strong>{{ link.label }}</strong>
              </a>
            }
          </div>
        </article>
      }
    </div>
  </article>
</section>
